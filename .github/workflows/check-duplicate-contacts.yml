name: Check for stale excel_import duplicate contacts

# One-off, read-only diagnostic: finds companies that have both a stale
# excel_import-sourced record (no quote_no, no quotation_date -- the
# "Becon" pattern) AND another record for the same company that's
# actually good, to see how widespread this duplicate issue is before
# deciding whether to merge anything.
#
# Runs scripts/diagnostics/check_duplicate_contacts.php directly on the
# server (deployed there automatically, same as any other app file) --
# avoids embedding PHP with $-variables inside a double-quoted SSH
# --execute string, which breaks because the remote shell ALSO
# interprets unescaped $ inside its own double quotes (bit us on the
# first version of this workflow).
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: "82.25.120.6"
      SSH_PORT: "65002"
      SSH_USER: "u829428207"
      DEPLOY_PATH: "domains/copperfitting.in/public_html/orbitcrm"
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Run the duplicate-check script
        env:
          SSH_PASS: ${{ secrets.CLIENT_SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "php $DEPLOY_PATH/app/scripts/diagnostics/check_duplicate_contacts.php"
