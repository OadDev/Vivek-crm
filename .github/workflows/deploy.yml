name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, zip, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      # HOSTINGER_DEPLOY_PATH *is* the domain's public_html folder -- no
      # separate public_html secret, no symlink. Everything except public/
      # goes into HOSTINGER_DEPLOY_PATH/app/ (still technically under the
      # same webroot -- see .htaccess/index.php below for how requests are
      # routed). This also sidesteps shared-hosting PHP-FPM sandboxing
      # (open_basedir) that can silently block a symlink pointing outside
      # the domain's own folder.
      - name: Deploy app bundle (vendor, app, bootstrap, etc.) to HOSTINGER_DEPLOY_PATH/app
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" rsync -rltz --delete \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='/.git/' --exclude='/.github/' --exclude='/tests/' \
            --exclude='/.env' --exclude='/public/' --exclude='/deploy/' \
            --exclude='/storage/app/' --exclude='/storage/framework/cache/' \
            --exclude='/storage/framework/sessions/' --exclude='/storage/framework/views/' \
            --exclude='/storage/logs/' --exclude='/node_modules/' \
            ./ "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/app/"

      # Copies public/ contents (assets, .htaccess, favicon, robots.txt) to
      # the webroot itself. index.php is excluded here and deployed
      # separately below (a modified version pointing into app/).
      - name: Deploy public assets to HOSTINGER_DEPLOY_PATH
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" rsync -rltz \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='index.php' --exclude='/app/' \
            ./public/ "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/"

      - name: Deploy front controller (index.php)
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" rsync -rltz \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no" \
            ./deploy/hostinger-index.php "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/index.php"

      # app/ holds .env, vendor/, etc. and sits under the same webroot as
      # index.php on this hosting plan (no way to place it outside the
      # document root) -- without this, https://yourdomain/app/.env would be
      # a real, publicly downloadable file.
      - name: Block direct HTTP access to HOSTINGER_DEPLOY_PATH/app
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" rsync -rltz \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no" \
            ./deploy/app-htaccess "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/app/.htaccess"

      # Idempotent -- safe on every deploy. Creates the directories Laravel
      # needs to write into (excluded from rsync so real data in them
      # survives deploys).
      - name: Ensure storage directories exist
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            'cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}/app && \
             mkdir -p storage/app/private storage/app/public \
                      storage/framework/cache/data storage/framework/sessions storage/framework/views \
                      storage/logs && \
             chmod -R 775 storage bootstrap/cache'

      # .env is deliberately excluded from rsync (so a real, populated one
      # never gets clobbered by a deploy) -- but that also means a brand new
      # app/ directory has no .env at all, and Laravel 500s immediately (no
      # APP_KEY -> cookie/session encryption fails) before the Setup Wizard
      # ever gets a chance to run. Bootstrap one from .env.example the first
      # time only; once a real .env exists here, only APP_URL gets corrected
      # (in case the domain changes) -- everything else is left alone.
      - name: Bootstrap .env on first deploy
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            'cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}/app && \
             PHP_BIN=""; \
             for c in php8.4 php8.3 php8.2 php82 php8_2; do p=$(command -v "$c" 2>/dev/null) && PHP_BIN="$p" && break; done; \
             if [ -z "$PHP_BIN" ]; then \
               for p in /opt/alt/php82/usr/bin/php /opt/cpanel/ea-php82/root/usr/bin/php /usr/local/bin/php8.2 /usr/local/php82/bin/php /usr/bin/php8.2; do \
                 [ -x "$p" ] && PHP_BIN="$p" && break; \
               done; \
             fi; \
             [ -z "$PHP_BIN" ] && PHP_BIN=$(command -v php); \
             echo "Resolved PHP_BIN=$PHP_BIN -- $($PHP_BIN -v | head -1)" && \
             if [ ! -f .env ]; then \
               echo "No .env found -- bootstrapping one from .env.example" && \
               cp .env.example .env && \
               $PHP_BIN artisan key:generate --force; \
             else \
               echo ".env already exists -- leaving it alone"; \
             fi'

      # Hostinger's default `php` CLI alias may point at an older version
      # than the domain's configured PHP-FPM version (they're set
      # separately in hPanel). Picks the newest 8.2+ binary actually present
      # instead of assuming `php` resolves correctly.
      #
      # Skips migrate/cache until storage/app/installed.lock exists -- that
      # file is only created by the Setup Wizard (/setup) once .env and the
      # database actually exist, so running these before that would just
      # fail on every deploy until setup is done.
      - name: Run post-deploy commands
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            'cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}/app && \
             PHP_BIN=$(command -v php8.4 || command -v php8.3 || command -v php8.2 || command -v php) && \
             echo "Using $PHP_BIN ($($PHP_BIN -v | head -1))" && \
             if [ -f storage/app/installed.lock ]; then \
               $PHP_BIN artisan migrate --force && \
               $PHP_BIN artisan config:cache && \
               $PHP_BIN artisan route:cache && \
               $PHP_BIN artisan view:cache && \
               $PHP_BIN artisan event:cache && \
               $PHP_BIN artisan queue:restart; \
             else \
               echo "App not installed yet — visit /setup to finish installation. Skipping migrate/cache for now."; \
             fi'
